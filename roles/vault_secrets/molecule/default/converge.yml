- name: Tests - Converge
  hosts: docker-instance-1
  become: true
  tasks:
    - name: "Tests - Converge - Execute role"
      ansible.builtin.include_role:
        name: vault_secrets
  vars:
    vault_address: "http://localhost:8200"
    vault_token: ""
    vault_username: "vault-user"
    vault_password: "changeme"
    export_mounts:
      - name: "vault-secrets-dev-1"
        engine: "Kv2"
      - name: "vault-secrets-dev-2"
        engine: "Kv2"
    import_mounts:
      - name: "vault-secrets-dev-1"
        engine: "Kv2"
      - name: "vault-secrets-dev-2"
        engine: "Kv2"
    request_interval_ms: 200
    encryption_passphrase: "changeme"
