dependency:
  name: galaxy
  options:
    role-file: ""

driver:
  name: docker

platforms:
  - name: docker-instance-1
    image: geerlingguy/docker-debian13-ansible:latest
    command: /sbin/init
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/run/docker.sock:/var/run/docker.sock

provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
  ansible_args:
    - "--skip-tags=skip-tests"

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
